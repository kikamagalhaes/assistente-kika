<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 400px; padding: 15px; font-family: 'Segoe UI', sans-serif; }
    input, textarea, button { width: 100%; box-sizing: border-box; margin-bottom: 10px; border-radius: 5px; }
    input, textarea { padding: 8px; border: 1px solid #ccc; }
    textarea { height: 80px; resize: none; }
    button { padding: 10px; background: #6200ea; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #3700b3; }
    #resultado { margin-top: 15px; font-size: 14px; white-space: pre-wrap; background: #f5f5f5; padding: 10px; border-radius: 5px; min-height: 50px; }
  </style>
</head>
<body>
  <h3>Assistente IA</h3>
  <input type="password" id="apiKey" placeholder="Cole sua chave do Gemini aqui">
  <textarea id="prompt" placeholder="O que você quer que eu faça com esta página? Ex: Resuma os pontos principais."></textarea>
  <button id="btnAnalisar">Analisar Página</button>
  
  <div id="resultado">Aguardando comando...</div>

  <script src="popup.js"></script>
</body>
</html>
